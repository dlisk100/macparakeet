name: Fn-stop validation and Mac build
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or branch to validate
        required: true
        default: main
      build_app:
        description: Run full tests and produce custom dev app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
      - name: Environment
        run: |
          mkdir -p ci-logs
          git rev-parse HEAD | tee ci-logs/commit.txt
          swift --version
          uname -m
      - uses: actions/cache@v4
        with:
          path: |
            .build
          key: fn-stop-macos14-xcode161-${{ hashFiles('Package.resolved') }}-${{ inputs.source_ref }}
          restore-keys: fn-stop-macos14-xcode161-${{ hashFiles('Package.resolved') }}-
      - name: Focused hotkey and settings tests
        run: |
          set -o pipefail
          swift test --filter 'HotkeyGestureControllerTests|HotkeyManagerTests|HotkeyTapFilterTests|AppHotkeyCoordinatorTests|SettingsViewModelTests|DictationFlowStateMachineTests' 2>&1 | tee ci-logs/focused.log
      - name: FFmpeg for full-suite integration tests
        if: inputs.build_app
        run: brew install ffmpeg
      - name: Full suite final gate
        if: inputs.build_app
        run: |
          set -o pipefail
          export MACPARAKEET_CLI_TEST_EXECUTABLE="$PWD/.build/debug/macparakeet-cli"
          swift test --skip-build --parallel 2>&1 | tee ci-logs/full-suite.log
      - name: Build optimized custom dev app
        if: inputs.build_app
        env:
          MACPARAKEET_CONFIG: Release
          MACPARAKEET_TELEMETRY: '0'
        run: |
          set -o pipefail
          bash scripts/dev/run_app.sh 2>&1 | tee ci-logs/build-app.log
          codesign --verify --deep --strict .build/xcode-dev/Build/Products/Release/MacParakeet-Dev.app
          ditto -c -k --sequesterRsrc --keepParent .build/xcode-dev/Build/Products/Release/MacParakeet-Dev.app MacParakeet-Fn-Stop-Dev.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fn-stop-evidence
          path: ci-logs/
      - uses: actions/upload-artifact@v4
        if: success() && inputs.build_app
        with:
          name: MacParakeet-Fn-Stop-Dev
          path: MacParakeet-Fn-Stop-Dev.zip
          retention-days: 14
